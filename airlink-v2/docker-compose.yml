services:
  db:
    image: mariadb:10.11
    container_name: airlink_v2_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456789000}
      MYSQL_DATABASE: ${DB_NAME:-air_db}
      TZ: ${TIMEZONE:-Asia/Bangkok}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-123456789000}"]
      interval: 5s
      timeout: 5s
      retries: 10

  radius:
    build:
      context: ./radius
      dockerfile: Dockerfile
    container_name: airlink_v2_radius
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    environment:
      TZ: ${TIMEZONE:-Asia/Bangkok}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airlink_v2_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-123456789000}
      DB_NAME: ${DB_NAME:-air_db}
      TZ: ${TIMEZONE:-Asia/Bangkok}
    ports:
      - "${BACKEND_PORT:-5000}:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airlink_v2_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5000/api"
      TZ: ${TIMEZONE:-Asia/Bangkok}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  db_data:
    name: airlink_v2_db_data
